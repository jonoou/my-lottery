<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双色球智能选号系统</title>
<style>
  :root { --p: #e63946; --s: #1d3557; --bg: #f8f9fa; --red: #ff4d4f; --blue: #1890ff; }
  body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; }
  .box { max-width: 1000px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
  .tit { font-size: 1rem; font-weight: bold; color: var(--s); margin-bottom: 10px; border-left: 4px solid var(--p); padding-left: 8px; }
  .fg { margin-bottom: 10px; font-size: 0.85rem; }
  select, input { width: 100%; padding: 6px; border: 1px solid #d9d9d9; border-radius: 4px; box-sizing: border-box; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btn { background: var(--p); color: #fff; border: none; padding: 10px; border-radius: 4px; cursor: pointer; flex: 2; font-weight: bold; }
  .btn-e { background: #2b9348; flex: 1; }
  .kbox { display: flex; flex-wrap: wrap; gap: 4px; background: #f8f9fa; padding: 8px; border-radius: 4px; }
  .kb { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; background: #fff; }
  .kb.act { background: #343a40; color: #fff; border-color: #343a40; }
  .row { display: flex; align-items: center; margin-bottom: 8px; padding: 6px; background: #f1f3f5; border-radius: 6px; }
  .b { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 4px; font-size: 0.8rem; }
  .b.r { background: linear-gradient(135deg, #ff7875, var(--red)); }
  .b.u { background: linear-gradient(135deg, #69c0ff, var(--blue)); }
  .div { width: 1px; height: 16px; background: #ccc; margin: 0 6px; }
  .tag { font-size: 0.7rem; background: #e9ecef; padding: 2px 4px; border-radius: 4px; margin-left: auto; color: #495057; }
  .wrap { max-height: 160px; overflow-y: auto; font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px; border-bottom: 1px solid #efefef; text-align: left; }
  th { background: #f1f3f5; position: sticky; top: 0; }
  .chart { display: flex; align-items: flex-end; height: 80px; gap: 1px; border-bottom: 2px solid #ccc; }
  .bw { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 0.6rem; }
  .bar { width: 100%; background: #ced4da; min-height: 2px; }
</style>
</head>
<body>
<div class="box">
  <h2 style="text-align:center;color:var(--s);margin:0 0 15px 0;">🔮 双色球智能分析选号系统</h2>
  <div class="grid">
    <div>
      <div class="card">
        <div class="tit">⚙️ 条件参数设置</div>
        <div class="fg"><label>生成注数</label><input type="number" id="tc" min="1" max="100" value="5"></div>
        <div class="fg">
          <label>红球奇偶比</label>
          <select id="pr">
            <option value="bal" selected>常态均衡 (3奇3偶 / 4奇2偶 / 2奇4偶)</option>
            <option value="33">严格 3奇 : 3偶</option>
            <option value="any">不限比例</option>
          </select>
        </div>
        <div class="fg">
          <label>红球大小比 (01-16小，17-33大)</label>
          <select id="sr">
            <option value="bal" selected>常态均衡 (3大3小 / 4大2小 / 2大4小)</option>
            <option value="33">严格 3大 : 3小</option>
            <option value="any">不限比例</option>
          </select>
        </div>
        <div class="fg"><label>手动杀红号 (点击排除，最多6个)</label><div class="kbox" id="kb"></div></div>
        <div class="btns">
          <button class="btn" onclick="gen()">⚡ 智能生成</button>
          <button class="btn btn-e" onclick="exp()">💾 导出Excel</button>
        </div>
      </div>
      <div class="card"><div class="tit">🎉 选号结果</div><div id="res"></div></div>
    </div>
    <div>
      <div class="card"><div class="tit">📊 红球热度走势 (近10期)</div><div class="chart" id="ct"></div></div>
      <div class="card">
        <div class="tit">📜 历史开奖碰撞库 (自动规避一等奖)</div>
        <div class="wrap"><table><thead><tr><th>期号</th><th>红球号码</th><th>蓝球</th></tr></thead><tbody id="hist"></tbody></table></div>
      </div>
    </div>
  </div>
</div>

<script>
  const rawHist = [
    "2026131|02,08,14,19,25,31|15",
    "2026130|01,06,12,18,24,30|02",
    "2026129|03,09,15,21,27,33|05",
    "2026128|04,10,16,22,28,32|11",
    "2026127|05,11,17,23,29,31|12",
    "2026126|02,07,13,19,26,30|08",
    "2026125|01,08,15,20,25,33|11",
    "2026124|06,11,14,22,27,29|09",
    "2026123|03,07,16,21,28,32|12",
    "2026122|04,09,12,18,24,31|06"
  ];

  let histData = rawHist.map(str => {
    const p = str.split('|');
    return { q: p[0], r: p[1].split(',').map(Number), b: Number(p[2]) };
  });

  let killed = new Set();
  let results = [];

  window.onload = async function() {
    initKill();
    await syncOnline();
    renderHist();
    renderChart();
    gen();
  };

  function initKill() {
    const box = document.getElementById('kb');
    for (let i = 1; i <= 33; i++) {
      const el = document.createElement('div');
      el.className = 'kb';
      el.innerText = String(i).padStart(2, '0');
      el.onclick = function() {
        if (killed.has(i)) { killed.delete(i); el.classList.remove('act'); }
        else {
          if (killed.size >= 6) return alert('最多只能排除6个红号！');
          killed.add(i); el.classList.add('act');
        }
      };
      box.appendChild(el);
    }
  }

  async function syncOnline() {
    try {
      const res = await fetch('https://mxnzp.com');
      const json = await res.json();
      if (json && json.code === 1 && json.data) {
        histData = json.data.map(item => {
          const parts = item.openCode.split('+');
          return {
            q: item.expect,
            r: parts[0].split(',').map(Number).sort((a,b) => a - b),
            b: Number(parts[1])
          };
        });
      }
    } catch (e) {
      console.log('使用本地历史数据库进行运算');
    }
  }

  function renderHist() {
    document.getElementById('hist').innerHTML = histData.map(item => 
      `<tr><td>${item.q}</td><td style="color:var(--p);font-weight:bold;">${item.r.map(n=>String(n).padStart(2,'0')).join(' ')}</td><td style="color:var(--blue);font-weight:bold;">${String(item.b).padStart(2,'0')}</td></tr>`
    ).join('');
  }

  function renderChart() {
    const ct = document.getElementById('ct');
    ct.innerHTML = '';
    const cnt = new Array(34).fill(0);
    histData.forEach(item => item.r.forEach(n => cnt[n]++));
    const max = Math.max(...cnt, 1);
    for (let i = 1; i <= 33; i++) {
      const w = document.createElement('div'); w.className = 'bw';
      const b = document.createElement('div'); b.className = 'bar';
      b.style.height = `${Math.max((cnt[i] / max) * 100, 5)}%`;
      if (cnt[i] > 1) b.style.background = 'var(--p)';
      const l = document.createElement('div'); l.innerText = String(i).padStart(2, '0');
      w.appendChild(b); w.appendChild(l); ct.appendChild(w);
    }
  }

  function gen() {
    const count = parseInt(document.getElementById('tc').value) || 5;
    const pOpt = document.getElementById('pr').value;
    const sOpt = document.getElementById('sr').value;
    const box = document.getElementById('res');
    box.innerHTML = '';
    results = [];
    let ok = 0, att = 0;

    while (ok < count && att < 5000) {
      att++;
      let reds = [];
      while (reds.length < 6) {
        let r = Math.floor(Math.random() * 33) + 1;
        if (!reds.includes(r) && !killed.has(r)) reds.push(r);
      }
      reds.sort((a, b) => a - b);

      const odd = reds.filter(n => n % 2 !== 0).length;
      const big = reds.filter(n => n >= 17).length;

      if (pOpt === '33' && odd !== 3) continue;
      if (pOpt === 'bal' && (odd < 2 || odd > 4)) continue;
      if (sOpt === '33' && big !== 3) continue;
      if (sOpt === 'bal' && (big < 2 || big > 4)) continue;

      if (histData.some(h => h.r.join(',') === reds.join(','))) continue;

      const blue = Math.floor(Math.random() * 16) + 1;
      ok++;
      results.push({ reds, blue, big, small: 6 - big, odd, even: 6 - odd });

      let html = `<div class="row">`;
      reds.forEach(n => html += `<div class="b r">${String(n).padStart(2, '0')}</div>`);
      html += `<div class="div"></div><div class="b u">${String(blue).padStart(2, '0')}</div>`;
      html += `<span class="tag">大小 ${big}:${6-big} | 奇偶 ${odd}:${6-odd}</span></div>`;
      box.innerHTML += html;
    }
    if (!ok) box.innerHTML = '<p style="color:red;text-align:center;">未找到匹配组合，请放宽条件限制。</p>';
  }

  function exp() {
    if (!results.length) return alert('当前没有可导出的数据！');
    let csv = "\uFEFF注数,红球号码,蓝球,大小比,奇偶比\n";
    results.forEach((t, i) => {
      csv += `${i+1},${t.reds.map(n=>String(n).padStart(2,'0')).join(' ')},${String(t.blue).padStart(2,'0')},${t.big}:${t.small},${t.odd}:${t.even}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '双色球智能机选结果.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
